<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480">
  <rect width="750" height="480" rx="44" fill="white" stroke="rgba(0,0,0,0.09)" stroke-width="3"/>
  <!-- Google G: blue arc + colored segments -->
  <g transform="translate(50,90)">
    <!-- Full circle background (white) -->
    <circle cx="160" cy="150" r="140" fill="white"/>
    <!-- Blue top/left arc -->
    <path d="M160,10 A140,140 0 1,0 300,150 L160,150 Z" fill="#4285F4"/>
    <!-- Red bottom-left -->
    <path d="M26,210 A140,140 0 0,0 105,278 L160,150 Z" fill="#EA4335"/>
    <!-- Yellow bottom-right -->
    <path d="M105,278 A140,140 0 0,0 248,272 L160,150 Z" fill="#FBBC04"/>
    <!-- Green right -->
    <path d="M248,272 A140,140 0 0,0 300,150 L160,150 Z" fill="#34A853"/>
    <!-- Inner white circle (creates the G arc) -->
    <circle cx="160" cy="150" r="90" fill="white"/>
    <!-- White block to cut G horizontal bar area from top -->
    <rect x="160" y="10" width="145" height="90" fill="white"/>
    <!-- Blue horizontal bar of G -->
    <rect x="160" y="120" width="145" height="60" fill="#4285F4"/>
    <!-- White right-end of bar to round it -->
    <rect x="270" y="120" width="40" height="60" fill="white"/>
    <circle cx="270" cy="150" r="30" fill="#4285F4"/>
  </g>
  <text x="490" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="400" fill="#3C4043">Pay</text>
</svg>
