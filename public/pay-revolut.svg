<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480">
  <rect width="750" height="480" rx="44" fill="white" stroke="rgba(0,0,0,0.09)" stroke-width="3"/>
  <!-- Revolut R mark: vertical stem + bowl + diagonal leg with notch -->
  <!-- Stem -->
  <rect x="68" y="100" width="56" height="290" rx="6" fill="#191C1F"/>
  <!-- Bowl outer (D-shape) -->
  <path d="M68 100 L220 100 Q310 100 310 195 Q310 285 220 290 L68 290 Z" fill="#191C1F"/>
  <!-- Bowl inner (white cutout) -->
  <path d="M124 148 L214 148 Q258 148 258 195 Q258 240 214 244 L124 244 Z" fill="white"/>
  <!-- Notch: white rect at bowl-leg junction -->
  <rect x="124" y="244" width="56" height="46" fill="white"/>
  <!-- Diagonal leg -->
  <polygon points="180,290 240,290 345,390 285,390" fill="#191C1F"/>
  <!-- "Pay" text -->
  <text x="390" y="370" font-family="Arial, Helvetica, sans-serif" font-size="186" font-weight="700" fill="#191C1F">Pay</text>
</svg>
