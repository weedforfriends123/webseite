<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480">
  <rect width="750" height="480" rx="44" fill="black"/>
  <!-- Apple logo mark built from basic shapes -->
  <g transform="translate(78, 60)">
    <!-- Leaf -->
    <ellipse cx="145" cy="52" rx="28" ry="52" transform="rotate(-18 145 52)" fill="white"/>
    <ellipse cx="145" cy="52" rx="18" ry="42" transform="rotate(-18 145 52)" fill="black"/>
    <!-- Apple body -->
    <rect x="55" y="88" width="180" height="220" rx="88" fill="white"/>
    <!-- Bite removed from upper right -->
    <circle cx="238" cy="118" r="72" fill="black"/>
    <!-- Top flat indent -->
    <rect x="95" y="68" width="100" height="50" fill="black"/>
  </g>
  <text x="500" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="168" font-weight="400" fill="white">Pay</text>
</svg>
