<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480">
  <rect width="750" height="480" rx="44" fill="white" stroke="rgba(0,0,0,0.09)" stroke-width="3"/>
  <!-- Blue band -->
  <rect x="36" y="120" width="678" height="240" rx="16" fill="#003399"/>
  <!-- SEPA text -->
  <text x="375" y="228" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="white" letter-spacing="8">SEPA</text>
  <!-- Lastschrift text -->
  <text x="375" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="400" fill="rgba(255,255,255,0.75)" letter-spacing="3">Lastschrift</text>
  <!-- 12 EU stars around the band center -->
  <g transform="translate(375,240)">
    <g id="star2">
      <polygon points="0,-12 3,-4 12,-4 5,2 7,11 0,5 -7,11 -5,2 -12,-4 -3,-4" fill="#FFCC00"/>
    </g>
    <use href="#star2" transform="rotate(0)   translate(0,-128)"/>
    <use href="#star2" transform="rotate(30)  translate(0,-128)"/>
    <use href="#star2" transform="rotate(60)  translate(0,-128)"/>
    <use href="#star2" transform="rotate(90)  translate(0,-128)"/>
    <use href="#star2" transform="rotate(120) translate(0,-128)"/>
    <use href="#star2" transform="rotate(150) translate(0,-128)"/>
    <use href="#star2" transform="rotate(180) translate(0,-128)"/>
    <use href="#star2" transform="rotate(210) translate(0,-128)"/>
    <use href="#star2" transform="rotate(240) translate(0,-128)"/>
    <use href="#star2" transform="rotate(270) translate(0,-128)"/>
    <use href="#star2" transform="rotate(300) translate(0,-128)"/>
    <use href="#star2" transform="rotate(330) translate(0,-128)"/>
  </g>
</svg>
