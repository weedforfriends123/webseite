<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" fill="none">
  <rect width="780" height="500" rx="40" fill="#003189"/>
  <!-- Euro stars ring -->
  <g transform="translate(390,250)">
    <g id="star"><polygon points="0,-22 5.1,-7.1 20.9,-7.1 8.5,2.7 13.6,17.6 0,7.8 -13.6,17.6 -8.5,2.7 -20.9,-7.1 -5.1,-7.1" fill="#FFCC00"/></g>
    <use href="#star" transform="rotate(0)  translate(0,-95)"/>
    <use href="#star" transform="rotate(30) translate(0,-95)"/>
    <use href="#star" transform="rotate(60) translate(0,-95)"/>
    <use href="#star" transform="rotate(90) translate(0,-95)"/>
    <use href="#star" transform="rotate(120) translate(0,-95)"/>
    <use href="#star" transform="rotate(150) translate(0,-95)"/>
    <use href="#star" transform="rotate(180) translate(0,-95)"/>
    <use href="#star" transform="rotate(210) translate(0,-95)"/>
    <use href="#star" transform="rotate(240) translate(0,-95)"/>
    <use href="#star" transform="rotate(270) translate(0,-95)"/>
    <use href="#star" transform="rotate(300) translate(0,-95)"/>
    <use href="#star" transform="rotate(330) translate(0,-95)"/>
  </g>
  <text x="390" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="white" letter-spacing="6">SEPA</text>
</svg>
