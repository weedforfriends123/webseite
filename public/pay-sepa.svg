<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480">
  <rect width="750" height="480" rx="44" fill="white" stroke="rgba(0,0,0,0.09)" stroke-width="3"/>
  <!-- Blue band -->
  <rect x="36" y="155" width="678" height="170" rx="16" fill="#003399"/>
  <!-- SEPA text -->
  <text x="375" y="272" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="116" font-weight="900" fill="white" letter-spacing="10">SEPA</text>
  <!-- 12 EU stars arranged in a circle around the center of the band -->
  <g transform="translate(375,240)">
    <g id="star">
      <polygon points="0,-14 3,-4 14,-4 5,2 8,12 0,5 -8,12 -5,2 -14,-4 -3,-4" fill="#FFCC00"/>
    </g>
    <use href="#star" transform="rotate(0)   translate(0,-105)"/>
    <use href="#star" transform="rotate(30)  translate(0,-105)"/>
    <use href="#star" transform="rotate(60)  translate(0,-105)"/>
    <use href="#star" transform="rotate(90)  translate(0,-105)"/>
    <use href="#star" transform="rotate(120) translate(0,-105)"/>
    <use href="#star" transform="rotate(150) translate(0,-105)"/>
    <use href="#star" transform="rotate(180) translate(0,-105)"/>
    <use href="#star" transform="rotate(210) translate(0,-105)"/>
    <use href="#star" transform="rotate(240) translate(0,-105)"/>
    <use href="#star" transform="rotate(270) translate(0,-105)"/>
    <use href="#star" transform="rotate(300) translate(0,-105)"/>
    <use href="#star" transform="rotate(330) translate(0,-105)"/>
  </g>
</svg>
